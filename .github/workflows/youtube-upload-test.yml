name: YouTube Upload Test

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Python packages
        run: |
          python3 -m pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Create credentials file
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN" > token.json

      - name: Create test video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30" \
            -t 5 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            test-video.mp4

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |

          python3 <<'PY'

          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          token_data = json.load(
              open("token.json", encoding="utf-8")
          )

          credentials = Credentials(
              token=token_data.get("token"),
              refresh_token=token_data.get("refresh_token"),
              token_uri=token_data.get(
                  "token_uri",
                  "https://oauth2.googleapis.com/token"
              ),
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          body = {
              "snippet": {
                  "title": "YouTube Automation Test",
                  "description": "Private test upload from GitHub Actions.",
                  "tags": [
                      "test",
                      "automation"
                  ],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "private"
              }
          }

          media = MediaFileUpload(
              "test-video.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = request.execute()

          print("====================================")
          print("YOUTUBE UPLOAD SUCCESSFUL")
          print("====================================")
          print("Video ID:", response["id"])

          PY
