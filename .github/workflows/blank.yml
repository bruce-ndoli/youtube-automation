name: YouTube Automation

on:
  workflow_dispatch:

jobs:
  ai-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 5

      - name: Download AI model
        run: |
          ollama pull tinyllama

      - name: Generate test script
        run: |
          ollama run tinyllama "Write a 30 second YouTube Shorts script about AI robots working in factories. Use simple English. Start with a strong hook."

      - name: Show Ollama log if needed
        if: always()
        run: |
          cat ollama.log || true
