name: AI YouTube Shorts

on:
  workflow_dispatch:

  schedule:
    # Monday-Saturday at 11:30 AM Rwanda time
    # Rwanda = UTC+2
    # 11:30 Rwanda = 09:30 UTC
    - cron: "30 9 * * 1-6"

permissions:
  contents: write

jobs:
  create-and-upload-short:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL SYSTEM TOOLS
      # ============================================================

      - name: Install system tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            jq \
            fonts-dejavu

          echo "System tools installed."


      # ============================================================
      # 3. INSTALL PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          set -euo pipefail

          python3 -m pip install \
            --break-system-packages \
            piper-tts \
            feedparser \
            requests \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

          echo "Python packages installed."


      # ============================================================
      # 4. DOWNLOAD PIPER VOICE
      # ============================================================

      - name: Download Piper voice
        run: |
          set -euo pipefail

          mkdir -p models

          curl -L --retry 3 --retry-delay 5 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true" \
            -o models/en_US-lessac-medium.onnx

          curl -L --retry 3 --retry-delay 5 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json?download=true" \
            -o models/en_US-lessac-medium.onnx.json

          test -s models/en_US-lessac-medium.onnx
          test -s models/en_US-lessac-medium.onnx.json

          echo "Piper voice downloaded successfully."


      # ============================================================
      # 5. INSTALL OLLAMA
      # ============================================================

      - name: Install Ollama
        run: |
          set -euo pipefail

          curl -fsSL https://ollama.com/install.sh | sh

          echo "Ollama installed."


      # ============================================================
      # 6. START OLLAMA
      # ============================================================

      - name: Start Ollama
        run: |
          set -euo pipefail

          ollama serve > ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          for i in {1..30}; do

            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              exit 0
            fi

            sleep 2

          done

          echo "Ollama failed to start."

          cat ollama.log

          exit 1


      # ============================================================
      # 7. DOWNLOAD AI MODEL
      # ============================================================

      - name: Download AI model
        run: |
          set -euo pipefail

          ollama pull tinyllama

          echo "AI model downloaded."


      # ============================================================
      # 8. GET LATEST AI NEWS
      # ============================================================

      - name: Get latest AI news
        run: |
          set -euo pipefail

          curl \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "https://news.google.com/rss/search?q=artificial%20intelligence%20AI%20robots%20technology&hl=en-US&gl=US&ceid=US:en" \
            -o news.xml

          test -s news.xml

          echo "News downloaded."


      # ============================================================
      # 9. EXTRACT NEWS ARTICLES
      # ============================================================

      - name: Extract news articles
        run: |

          python3 <<'PY'

          import feedparser
          import html
          import re

          feed = feedparser.parse("news.xml")

          if not feed.entries:
              raise RuntimeError("No news articles found.")

          with open("articles.txt", "w", encoding="utf-8") as f:

              for i, entry in enumerate(feed.entries[:10], 1):

                  title = entry.get("title", "")
                  summary = entry.get("summary", "")
                  link = entry.get("link", "")

                  summary = html.unescape(summary)
                  summary = re.sub("<[^>]+>", " ", summary)
                  summary = re.sub(r"\s+", " ", summary).strip()

                  f.write(
                      f"ARTICLE {i}\n"
                      f"TITLE: {title}\n"
                      f"SUMMARY: {summary}\n"
                      f"URL: {link}\n\n"
                  )

          print("Articles extracted.")

          PY

          echo "=============================="
          echo "NEWS ARTICLES"
          echo "=============================="

          cat articles.txt


      # ============================================================
      # 10. SELECT THE NEWS STORY
      # ============================================================

      - name: Select AI story
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import requests

          with open(
              "articles.txt",
              encoding="utf-8"
          ) as f:
              articles = f.read()

          prompt = f"""
          You are selecting one news story for a YouTube Short.

          Choose the most interesting recent artificial intelligence
          or technology story from the articles below.

          Return ONLY the number of the article.

          ARTICLES:

          {articles}
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": "tinyllama",
                  "prompt": prompt,
                  "stream": False
              },
              timeout=120
          )

          response.raise_for_status()

          result = response.json().get("response", "")

          print("AI selection:")
          print(result)

          import re

          numbers = re.findall(
              r"\b(?:ARTICLE\s*)?([1-9]|10)\b",
              result.upper()
          )

          selected = int(numbers[0]) if numbers else 1

          if selected < 1 or selected > 10:
              selected = 1

          print("Selected article:", selected)

          with open(
              "selected_article_number.txt",
              "w"
          ) as f:
              f.write(str(selected))

          PY


      # ============================================================
      # 11. CREATE SCRIPT
      # ============================================================

      - name: Create AI video script
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import requests
          import re

          with open(
              "articles.txt",
              encoding="utf-8"
          ) as f:
              articles = f.read()

          with open(
              "selected_article_number.txt"
          ) as f:
              selected = int(f.read().strip())

          blocks = articles.split("ARTICLE ")

          if selected >= len(blocks):
              selected = 1

          article = blocks[selected]

          prompt = f"""
          Create a short YouTube Shorts narration about this AI news story.

          RULES:

          - 90 to 120 words.
          - Start with a strong hook.
          - Explain what happened.
          - Explain why it matters.
          - Keep the language simple.
          - Do not invent facts.
          - Do not mention that you are an AI.
          - Do not use headings.
          - Return ONLY the narration.

          NEWS:

          {article}
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": "tinyllama",
                  "prompt": prompt,
                  "stream": False
              },
              timeout=180
          )

          response.raise_for_status()

          script = response.json().get(
              "response",
              ""
          ).strip()

          script = re.sub(
              r"^(SCRIPT|NARRATION)\s*:\s*",
              "",
              script,
              flags=re.IGNORECASE
          )

          if len(script.split()) < 30:
              raise RuntimeError(
                  "AI generated script is too short."
              )

          with open(
              "script.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(script)

          print("====================================")
          print("GENERATED SCRIPT")
          print("====================================")
          print(script)

          PY


      # ============================================================
      # 12. CREATE YOUTUBE TITLE
      # ============================================================

      - name: Create YouTube title
        run: |

          set -euo pipefail

          python3 <<'PY'

          import requests
          import re

          with open(
              "script.txt",
              encoding="utf-8"
          ) as f:
              script = f.read()

          prompt = f"""
          Create one short YouTube Shorts title for this AI news story.

          Rules:
          - Maximum 70 characters.
          - Make it interesting.
          - No fake claims.
          - No quotation marks.
          - Return ONLY the title.

          STORY:

          {script}
          """

          response = requests.post(
              "http://127.0.0.1:11434/api/generate",
              json={
                  "model": "tinyllama",
                  "prompt": prompt,
                  "stream": False
              },
              timeout=120
          )

          response.raise_for_status()

          title = response.json().get(
              "response",
              ""
          ).strip()

          title = title.replace(
              "\n",
              " "
          )

          title = re.sub(
              r"^(TITLE|YOUTUBE TITLE)\s*:\s*",
              "",
              title,
              flags=re.IGNORECASE
          )

          title = title.strip(
              "\"' "
          )

          if not title:
              title = "The Latest AI News You Need to Know"

          title = title[:70]

          with open(
              "youtube_title.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(title)

          print("YouTube title:", title)

          PY


      # ============================================================
      # 13. CREATE YOUTUBE DESCRIPTION
      # ============================================================

      - name: Create YouTube description
        run: |

          cat > youtube_description.txt <<'EOF'
          Latest AI and technology news explained in a short and simple video.

          #AI #ArtificialIntelligence #Tech #AInews #Shorts
          EOF

          echo "YouTube description created."


      # ============================================================
      # 14. GENERATE VOICEOVER
      # ============================================================

      - name: Generate voiceover
        shell: bash
        run: |

          set -euo pipefail

          python3 -m piper \
            -m models/en_US-lessac-medium.onnx \
            --config models/en_US-lessac-medium.onnx.json \
            -f voice.wav \
            < script.txt

          test -s voice.wav

          echo "Voiceover created."

          ls -lh voice.wav


      # ============================================================
      # 15. CREATE VISUAL BACKGROUND
      # ============================================================

      - name: Create video background
        run: |

          set -euo pipefail

          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x101820:s=1080x1920:r=30" \
            -t 30 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            background.mp4

          test -s background.mp4

          echo "Background created."


      # ============================================================
      # 16. CREATE FINAL VIDEO
      # ============================================================

      - name: Render final video
        shell: bash
        run: |

          set -euo pipefail

          echo "Rendering final-video.mp4..."

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.wav)

          echo "Voice duration: $DURATION seconds"

          ffmpeg -y \
            -stream_loop -1 \
            -i background.mp4 \
            -i voice.wav \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            final-video.mp4

          test -s final-video.mp4

          echo "===================================="
          echo "VIDEO CREATED SUCCESSFULLY"
          echo "===================================="

          ls -lh final-video.mp4


      # ============================================================
      # 17. VERIFY FINAL VIDEO
      # ============================================================

      - name: Verify final generated video
        shell: bash
        run: |

          set -euo pipefail

          VIDEO="final-video.mp4"

          echo "Looking for final video..."

          if [ ! -f "$VIDEO" ]; then

            echo "ERROR: $VIDEO was not found."

            find . -maxdepth 4 -type f | sort

            exit 1

          fi

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: $VIDEO is empty."
            exit 1
          fi

          echo "===================================="
          echo "FINAL VIDEO FOUND"
          echo "===================================="

          ls -lh "$VIDEO"

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$VIDEO"


      # ============================================================
      # 18. CREATE YOUTUBE CREDENTIALS
      # ============================================================

      - name: Create YouTube credentials file
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}

        shell: bash

        run: |

          set -euo pipefail

          if [ -z "${YOUTUBE_TOKEN:-}" ]; then
            echo "YOUTUBE_TOKEN secret is empty."
            exit 1
          fi

          python3 <<'PY'

          import json
          import os

          raw = os.environ["YOUTUBE_TOKEN"]

          try:
              json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"YOUTUBE_TOKEN must be valid JSON: {exc}"
              )

          with open(
              "token.json",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(raw)

          print("YouTube token loaded successfully.")

          PY


      # ============================================================
      # 19. UPLOAD FINAL VIDEO TO YOUTUBE
      # ============================================================

      - name: Upload final video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

        shell: bash

        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload


          VIDEO_FILE = "final-video.mp4"


          # ========================================================
          # READ TOKEN
          # ========================================================

          with open(
              "token.json",
              encoding="utf-8"
          ) as f:
              token_data = json.load(f)


          required_fields = [
              "token",
              "refresh_token"
          ]


          missing = [
              field
              for field in required_fields
              if not token_data.get(field)
          ]


          if missing:
              raise SystemExit(
                  "token.json is missing required values: "
                  + ", ".join(missing)
              )


          # ========================================================
          # CREATE CREDENTIALS
          # ========================================================

          credentials = Credentials(

              token=token_data.get("token"),

              refresh_token=token_data.get(
                  "refresh_token"
              ),

              token_uri=token_data.get(
                  "token_uri",
                  "https://oauth2.googleapis.com/token"
              ),

              client_id=(
                  token_data.get("client_id")
                  or os.environ["YOUTUBE_CLIENT_ID"]
              ),

              client_secret=(
                  token_data.get("client_secret")
                  or os.environ["YOUTUBE_CLIENT_SECRET"]
              ),

              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ],
          )


          # ========================================================
          # CONNECT TO YOUTUBE
          # ========================================================

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )


          # ========================================================
          # READ TITLE
          # ========================================================

          with open(
              "youtube_title.txt",
              encoding="utf-8"
          ) as f:
              title = f.read().strip()


          # ========================================================
          # READ DESCRIPTION
          # ========================================================

          with open(
              "youtube_description.txt",
              encoding="utf-8"
          ) as f:
              description = f.read().strip()


          # ========================================================
          # YOUTUBE METADATA
          # ========================================================

          body = {

              "snippet": {

                  "title": title,

                  "description": description,

                  "tags": [
                      "AI",
                      "Artificial Intelligence",
                      "AI News",
                      "Technology",
                      "Tech News",
                      "AI Shorts",
                      "Shorts"
                  ],

                  "categoryId": "28",
              },

              "status": {

                  "privacyStatus": "public",

                  "selfDeclaredMadeForKids": False,
              },
          }


          # ========================================================
          # PREPARE VIDEO
          # ========================================================

          media = MediaFileUpload(

              VIDEO_FILE,

              mimetype="video/mp4",

              resumable=True,
          )


          # ========================================================
          # UPLOAD
          # ========================================================

          request = youtube.videos().insert(

              part="snippet,status",

              body=body,

              media_body=media,

              notifySubscribers=False,
          )


          print("====================================")
          print("STARTING YOUTUBE UPLOAD")
          print("====================================")


          response = None


          while response is None:

              status, response = request.next_chunk()

              if status:

                  print(
                      "Upload progress: "
                      f"{int(status.progress() * 100)}%"
                  )


          # ========================================================
          # SUCCESS
          # ========================================================

          video_id = response["id"]


          print()
          print("====================================")
          print("YOUTUBE UPLOAD SUCCESSFUL")
          print("====================================")

          print("Video ID:", video_id)

          print(
              "https://www.youtube.com/watch?v="
              + video_id
          )

          print("====================================")

          PY


      # ============================================================
      # 20. FINAL RESULT
      # ============================================================

      - name: Automation completed
        run: |

          echo "============================================"
          echo "AI YOUTUBE AUTOMATION COMPLETED"
          echo "============================================"

          echo "Scheduled time:"
          echo "11:30 AM Rwanda time"

          echo ""
          echo "Final video:"
          ls -lh final-video.mp4

          echo ""
          echo "YouTube upload completed."

          echo "============================================"
