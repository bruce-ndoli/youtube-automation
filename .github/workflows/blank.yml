name: AI YouTube Automation

on:
  workflow_dispatch:

  # Monday-Saturday: Shorts at 08:00 UTC = 10:00 AM Rwanda
  # Sunday: Full video at 08:00 UTC = 10:00 AM Rwanda
  schedule:
    - cron: "0 8 * * 1-6"
    - cron: "0 8 * * 0"

permissions:
  contents: write

jobs:
  youtube-automation:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. DETERMINE VIDEO TYPE
      # ==========================================================

      - name: Determine video type
        id: video_type
        run: |

          DAY=$(date -u +%u)

          echo "UTC day number: $DAY"

          if [ "$DAY" -eq 7 ]; then
            echo "type=full" >> "$GITHUB_OUTPUT"
            echo "FULL VIDEO DAY"
          else
            echo "type=short" >> "$GITHUB_OUTPUT"
            echo "SHORT VIDEO DAY"
          fi


      # ==========================================================
      # 3. INSTALL SYSTEM TOOLS
      # ==========================================================

      - name: Install system tools
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            jq \
            git


      # ==========================================================
      # 4. INSTALL PYTHON PACKAGES
      # ==========================================================

      - name: Install Python packages
        run: |

          python3 -m pip install \
            --break-system-packages \
            piper-tts \
            feedparser \
            requests


      # ==========================================================
      # 5. DOWNLOAD PIPER VOICE
      # ==========================================================

      - name: Download Piper voice
        run: |

          mkdir -p models

          curl -L \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true" \
            -o models/en_US-lessac-medium.onnx

          curl -L \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json?download=true" \
            -o models/en_US-lessac-medium.onnx.json

          test -s models/en_US-lessac-medium.onnx
          test -s models/en_US-lessac-medium.onnx.json

          echo "Piper voice downloaded."


      # ==========================================================
      # 6. INSTALL OLLAMA
      # ==========================================================

      - name: Install Ollama
        run: |

          curl -fsSL https://ollama.com/install.sh | sh


      # ==========================================================
      # 7. START OLLAMA
      # ==========================================================

      - name: Start Ollama
        run: |

          ollama serve > ollama.log 2>&1 &

          for i in {1..30}; do

            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi

            echo "Waiting for Ollama..."
            sleep 2

          done

          curl -s http://127.0.0.1:11434/api/tags


      # ==========================================================
      # 8. DOWNLOAD AI MODEL
      # ==========================================================

      - name: Download AI model
        run: |

          ollama pull tinyllama


      # ==========================================================
      # 9. GET AI NEWS
      # ==========================================================

      - name: Get latest AI news
        run: |

          curl --retry 3 --retry-delay 5 -L \
            "https://news.google.com/rss/search?q=artificial%20intelligence%20AI%20robots%20technology&hl=en-US&gl=US&ceid=US:en" \
            -o news.xml

          test -s news.xml

          echo "News downloaded."

          head -40 news.xml


      # ==========================================================
      # 10. EXTRACT ARTICLES
      # ==========================================================

      - name: Extract news articles
        run: |

          python3 <<'PY'

          import feedparser

          feed = feedparser.parse("news.xml")

          if not feed.entries:
              raise RuntimeError("No news articles found.")

          with open("articles.txt", "w", encoding="utf-8") as f:

              for i, entry in enumerate(feed.entries[:15], 1):

                  title = entry.get("title", "")
                  summary = entry.get("summary", "")
                  link = entry.get("link", "")

                  f.write(
                      f"ARTICLE {i}\n"
                      f"TITLE: {title}\n"
                      f"SUMMARY: {summary}\n"
                      f"URL: {link}\n\n"
                  )

          print("Articles extracted.")

          PY

          cat articles.txt


      # ==========================================================
      # 11. GENERATE CONTENT PACKAGE
      # ==========================================================

      - name: Generate AI content
        run: |

          NEWS=$(cat articles.txt)

          if [ "${{ steps.video_type.outputs.type }}" = "short" ]; then

            cat > prompt.txt <<EOF

You are an expert YouTube Shorts producer.

Use ONLY facts supported by the news articles below.

Choose ONE interesting recent AI or technology story.

Create a 30-60 second YouTube Shorts video.

Return EXACTLY this format:

TITLE:
one accurate short title

DESCRIPTION:
a short YouTube description

SCRIPT:
30-60 second narration

SCENE1:
detailed visual prompt for the first part

SCENE2:
detailed visual prompt for the second part

SCENE3:
detailed visual prompt for the third part

SCENE4:
detailed visual prompt for the fourth part

SCENE5:
detailed visual prompt for the ending

TAGS:
comma separated relevant tags

RULES:

Start with a powerful hook.

Use simple natural English.

Use short sentences.

Do not invent facts.

Do not invent statistics.

Do not invent quotes.

Do not invent events.

Do not use emojis.

Do not use bullet points inside SCRIPT.

Do not use headings inside SCRIPT.

The narration must be original storytelling based on the research.

All five scenes must describe the SAME story.

Make each scene visually different.

Visual prompts must contain:
cinematic realistic AI technology journalism,
no text,
no watermark,
no logo.

NEWS ARTICLES:

$NEWS

EOF

          else

            cat > prompt.txt <<EOF

You are an expert YouTube technology documentary producer.

Use ONLY facts supported by the news articles below.

Choose ONE interesting recent AI or technology story.

Create a substantial long-form YouTube video.

Target narration length:
approximately 8-12 minutes.

Return EXACTLY this format:

TITLE:
accurate clickable title

DESCRIPTION:
YouTube description

SCRIPT:
long-form narration

SCENE1:
detailed visual prompt

SCENE2:
detailed visual prompt

SCENE3:
detailed visual prompt

SCENE4:
detailed visual prompt

SCENE5:
detailed visual prompt

SCENE6:
detailed visual prompt

SCENE7:
detailed visual prompt

SCENE8:
detailed visual prompt

SCENE9:
detailed visual prompt

SCENE10:
detailed visual prompt

SCENE11:
detailed visual prompt

SCENE12:
detailed visual prompt

TAGS:
comma separated relevant tags

RULES:

Start with a strong hook.

Use simple natural English.

Explain the story clearly.

Maintain viewer curiosity.

Use only facts supported by the research.

Do not invent facts.

Do not invent statistics.

Do not invent quotes.

Do not invent events.

Do not use emojis.

Do not use bullet points inside SCRIPT.

Do not put headings inside SCRIPT.

The narration must be original storytelling and commentary.

Each scene must visually support the narration.

Make scenes visually different.

Visual prompts must contain:
cinematic realistic AI technology documentary,
no unnecessary text,
no watermark.

NEWS ARTICLES:

$NEWS

EOF

          fi

          ollama run tinyllama "$(cat prompt.txt)" > story.txt

          test -s story.txt

          echo "=============================="
          echo "GENERATED STORY"
          echo "=============================="

          cat story.txt


      # ==========================================================
      # 12. PARSE AI OUTPUT
      # ==========================================================

      - name: Parse AI content
        run: |

          python3 <<'PY'

          import re

          text = open(
              "story.txt",
              encoding="utf-8"
          ).read()

          def extract(start, end=None):

              if end:

                  pattern = (
                      rf"^\s*{start}:\s*(.*?)"
                      rf"(?=^\s*{end}:)"
                  )

              else:

                  pattern = (
                      rf"^\s*{start}:\s*(.*)"
                  )

              match = re.search(
                  pattern,
                  text,
                  re.I | re.S | re.M
              )

              if not match:
                  return ""

              return match.group(1).strip()


          title = extract("TITLE", "DESCRIPTION")
          description = extract("DESCRIPTION", "SCRIPT")
          
          if "${{ steps.video_type.outputs.type }}" == "short":

              script = extract("SCRIPT", "SCENE1")

              scenes = [
                  extract("SCENE1", "SCENE2"),
                  extract("SCENE2", "SCENE3"),
                  extract("SCENE3", "SCENE4"),
                  extract("SCENE4", "SCENE5"),
                  extract("SCENE5", "TAGS")
              ]

          else:

              script = extract("SCRIPT", "SCENE1")

              scenes = [
                  extract("SCENE1", "SCENE2"),
                  extract("SCENE2", "SCENE3"),
                  extract("SCENE3", "SCENE4"),
                  extract("SCENE4", "SCENE5"),
                  extract("SCENE5", "SCENE6"),
                  extract("SCENE6", "SCENE7"),
                  extract("SCENE7", "SCENE8"),
                  extract("SCENE8", "SCENE9"),
                  extract("SCENE9", "SCENE10"),
                  extract("SCENE10", "SCENE11"),
                  extract("SCENE11", "SCENE12"),
                  extract("SCENE12", "TAGS")
              ]

          tags = extract("TAGS")

          if not title:
              raise RuntimeError("AI failed to create title.")

          if not script:
              raise RuntimeError("AI failed to create script.")

          if len(script) < 100:
              raise RuntimeError("Generated script is too short.")

          open(
              "title.txt",
              "w",
              encoding="utf-8"
          ).write(title)

          open(
              "description.txt",
              "w",
              encoding="utf-8"
          ).write(description)

          open(
              "script.txt",
              "w",
              encoding="utf-8"
          ).write(script)

          open(
              "tags.txt",
              "w",
              encoding="utf-8"
          ).write(tags)

          for i, scene in enumerate(scenes, 1):

              if scene.strip():

                  open(
                      f"scene{i}.txt",
                      "w",
                      encoding="utf-8"
                  ).write(scene)

          print("Title:")
          print(title)

          print("\nScript:")
          print(script)

          print("\nScenes:")

          for i, scene in enumerate(scenes, 1):

              print(f"SCENE {i}:")
              print(scene)

          PY


      # ==========================================================
      # 13. GENERATE AI IMAGES
      # ==========================================================

      - name: Generate AI images
        run: |

          python3 <<'PY'

          import requests
          import urllib.parse
          import time
          import os

          video_type = "${{ steps.video_type.outputs.type }}"

          if video_type == "short":
              total_scenes = 5
              width = 1080
              height = 1920
          else:
              total_scenes = 12
              width = 1920
              height = 1080

          for i in range(1, total_scenes + 1):

              filename = f"scene{i}.txt"

              if not os.path.exists(filename):
                  raise RuntimeError(
                      f"Missing scene {i}"
                  )

              prompt = open(
                  filename,
                  encoding="utf-8"
              ).read().strip()

              if not prompt:
                  raise RuntimeError(
                      f"Empty scene {i}"
                  )

              full_prompt = (
                  "High quality cinematic technology documentary. "
                  "Realistic photography. "
                  "Professional lighting. "
                  "Detailed environment. "
                  "Visually interesting. "
                  "No watermark. "
                  "No unnecessary text. "
                  + prompt
              )

              encoded = urllib.parse.quote(
                  full_prompt
              )

              url = (
                  "https://image.pollinations.ai/prompt/"
                  + encoded
                  + f"?width={width}&height={height}&nologo=true"
              )

              print(
                  f"Generating image {i}/{total_scenes}"
              )

              success = False

              for attempt in range(1, 4):

                  try:

                      response = requests.get(
                          url,
                          timeout=120
                      )

                      print(
                          "HTTP:",
                          response.status_code,
                          "SIZE:",
                          len(response.content)
                      )

                      if (
                          response.status_code == 200
                          and len(response.content) > 10000
                      ):

                          with open(
                              f"image{i}.jpg",
                              "wb"
                          ) as f:

                              f.write(
                                  response.content
                              )

                          success = True
                          break

                  except Exception as e:

                      print(
                          "ERROR:",
                          e
                      )

                  time.sleep(5)

              if not success:

                  raise RuntimeError(
                      f"Image generation failed for scene {i}"
                  )

          print(
              "All images generated successfully."
          )

          PY


      # ==========================================================
      # 14. GENERATE VOICEOVER
      # ==========================================================

      - name: Generate voiceover
        run: |

          python3 -m piper \
            -m models/en_US-lessac-medium.onnx \
            -i script.txt \
            -f voiceover.wav

          test -s voiceover.wav

          echo "Voiceover generated."


      # ==========================================================
      # 15. CREATE CAPTIONS
      # ==========================================================

      - name: Create captions
        run: |

          python3 <<'PY'

          import wave

          script = open(
              "script.txt",
              encoding="utf-8"
          ).read().strip()

          words = script.split()

          if not words:
              raise RuntimeError(
                  "Script is empty."
              )

          with wave.open(
              "voiceover.wav",
              "rb"
          ) as audio:

              duration = (
                  audio.getnframes()
                  /
                  audio.getframerate()
              )

          time_per_word = (
              duration / len(words)
          )

          def timestamp(seconds):

              h = int(seconds // 3600)

              m = int(
                  (seconds % 3600) // 60
              )

              s = int(seconds % 60)

              ms = int(
                  (seconds - int(seconds))
                  * 1000
              )

              return (
                  f"{h:02}:{m:02}:"
                  f"{s:02},{ms:03}"
              )

          with open(
              "captions.srt",
              "w",
              encoding="utf-8"
          ) as f:

              chunk_size = 5

              for i in range(
                  0,
                  len(words),
                  chunk_size
              ):

                  chunk = words[
                      i:i + chunk_size
                  ]

                  start = (
                      i * time_per_word
                  )

                  end = min(
                      (
                          i + len(chunk)
                      ) * time_per_word,
                      duration
                  )

                  number = (
                      i // chunk_size
                  ) + 1

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )

                  f.write(
                      " ".join(chunk)
                  )

                  f.write("\n\n")

          print("Captions generated.")

          PY


      # ==========================================================
      # 16. CREATE ROYALTY-FREE MUSIC
      # ==========================================================

      - name: Create background music
        run: |

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=110:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=165:sample_rate=44100" \
            -filter_complex \
            "[0:a]volume=0.02[a0];[1:a]volume=0.012[a1];[a0][a1]amix=inputs=2:duration=longest" \
            -t 900 \
            music.wav

          test -s music.wav


      # ==========================================================
      # 17. GET VOICEOVER DURATION
      # ==========================================================

      - name: Get duration
        run: |

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voiceover.wav \
            > duration.txt

          cat duration.txt


      # ==========================================================
      # 18. CREATE VISUAL CLIPS
      # ==========================================================

      - name: Create visual clips
        run: |

          DURATION=$(cat duration.txt)

          if [ "${{ steps.video_type.outputs.type }}" = "short" ]; then

            WIDTH=1080
            HEIGHT=1920
            TOTAL=5

          else

            WIDTH=1920
            HEIGHT=1080
            TOTAL=12

          fi

          CLIP_DURATION=$(python3 -c "
          d=float('$DURATION')
          n=$TOTAL
          print(max(d/n,1))
          ")

          echo "Clip duration: $CLIP_DURATION"

          for i in $(seq 1 $TOTAL)
          do

            echo "Creating clip $i"

            ffmpeg -y \
              -loop 1 \
              -i "image${i}.jpg" \
              -t "$CLIP_DURATION" \
              -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=increase,crop=${WIDTH}:${HEIGHT},zoompan=z='min(zoom+0.0007,1.08)':d=1:s=${WIDTH}x${HEIGHT}:fps=30" \
              -r 30 \
              -pix_fmt yuv420p \
              -an \
              "clip${i}.mp4"

          done


      # ==========================================================
      # 19. JOIN VISUAL CLIPS
      # ==========================================================

      - name: Join visual clips
        run: |

          if [ "${{ steps.video_type.outputs.type }}" = "short" ]; then
            TOTAL=5
          else
            TOTAL=12
          fi

          rm -f concat.txt

          for i in $(seq 1 $TOTAL)
          do
            echo "file 'clip${i}.mp4'" >> concat.txt
          done

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            visuals.mp4


      # ==========================================================
      # 20. CREATE FINAL VIDEO
      # ==========================================================

      - name: Create final video
        run: |

          if [ "${{ steps.video_type.outputs.type }}" = "short" ]; then

            WIDTH=1080
            HEIGHT=1920
            OUTPUT=short.mp4
            FONT_SIZE=18
            MARGIN=180

          else

            WIDTH=1920
            HEIGHT=1080
            OUTPUT=full-video.mp4
            FONT_SIZE=14
            MARGIN=80

          fi

          ffmpeg -y \
            -i visuals.mp4 \
            -i voiceover.wav \
            -i music.wav \
            -filter_complex \
            "[2:a]volume=0.08[music];[1:a]volume=1.0[voice];[voice][music]amix=inputs=2:duration=first[audio]" \
            -map 0:v \
            -map "[audio]" \
            -vf "subtitles=captions.srt:force_style='FontName=DejaVu Sans,FontSize=${FONT_SIZE},Bold=1,Alignment=2,MarginV=${MARGIN}'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -pix_fmt yuv420p \
            -movflags +faststart \
            "$OUTPUT"

          test -s "$OUTPUT"


      # ==========================================================
      # 21. VALIDATE VIDEO
      # ==========================================================

      - name: Validate final video
        run: |

          if [ "${{ steps.video_type.outputs.type }}" = "short" ]; then
            VIDEO="short.mp4"
            EXPECTED="1080x1920"
          else
            VIDEO="full-video.mp4"
            EXPECTED="1920x1080"
          fi

          echo "Validating $VIDEO"

          ffprobe \
            -v error \
            "$VIDEO"

          DIMENSIONS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 \
            "$VIDEO")

          echo "Dimensions: $DIMENSIONS"

          if [ "$DIMENSIONS" != "$EXPECTED" ]; then
            echo "ERROR: Wrong dimensions."
            exit 1
          fi

          AUDIO=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            "$VIDEO")

          if [ -z "$AUDIO" ]; then
            echo "ERROR: No audio."
            exit 1
          fi

          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO")

          echo "Final duration: $DURATION"

          echo "VIDEO VALIDATION PASSED."


      # ==========================================================
      # 22. SAVE ARTIFACTS
      # ==========================================================

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:

          name: youtube-${{ steps.video_type.outputs.type }}

          path: |
            short.mp4
            full-video.mp4
            title.txt
            description.txt
            tags.txt
            script.txt
            story.txt
            captions.srt
            voiceover.wav
            image*.jpg


      # ==========================================================
      # 23. SHOW RESULT
      # ==========================================================

      - name: Show result
        run: |

          echo ""
          echo "=========================================="
          echo "       AI YOUTUBE VIDEO CREATED"
          echo "=========================================="

          echo ""
          echo "VIDEO TYPE:"
          echo "${{ steps.video_type.outputs.type }}"

          echo ""
          echo "TITLE:"
          cat title.txt

          echo ""
          echo "DESCRIPTION:"
          cat description.txt

          echo ""
          echo "TAGS:"
          cat tags.txt

          echo ""
          echo "FILES:"
          ls -lh *.mp4 *.wav *.srt *.jpg 2>/dev/null || true


      # ==========================================================
      # 24. SAVE HISTORY
      # ==========================================================

      - name: Update content history
        run: |

          mkdir -p data

          if [ ! -f data/content_history.txt ]; then
            touch data/content_history.txt
          fi

          DATE=$(date -u +"%Y-%m-%d")

          {
            echo "DATE: $DATE"
            echo "TYPE: ${{ steps.video_type.outputs.type }}"
            echo "TITLE: $(cat title.txt)"
            echo ""
          } >> data/content_history.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/content_history.txt

          git commit \
            -m "Update YouTube content history" \
            || echo "Nothing to commit."

          git push \
            || echo "Could not push history."


      # ==========================================================
      # 25. SHOW OLLAMA LOG IF SOMETHING FAILS
      # ==========================================================

      - name: Show logs
        if: always()
        run: |

          echo "========== OLLAMA LOG =========="

          cat ollama.log 2>/dev/null || true
