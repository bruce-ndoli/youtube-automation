name: AI YouTube Shorts

on:
  workflow_dispatch:

  schedule:
    # Monday-Saturday at 10:00 AM Rwanda time
    # Rwanda = UTC+2, so 10:00 AM = 08:00 UTC
    - cron: "0 8 * * 1-6"

permissions:
  contents: write

jobs:
  create-short:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL SYSTEM TOOLS
      # ============================================================

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            python3 \
            python3-pip \
            curl \
            jq

          echo "System tools installed."


      # ============================================================
      # 3. INSTALL PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python3 -m pip install \
            --break-system-packages \
            piper-tts \
            feedparser \
            requests

          echo "Python packages installed."


      # ============================================================
      # 4. DOWNLOAD PIPER VOICE
      # ============================================================

      - name: Download Piper voice
        run: |
          mkdir -p models

          curl -L \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true" \
            -o models/en_US-lessac-medium.onnx

          curl -L \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json?download=true" \
            -o models/en_US-lessac-medium.onnx.json

          test -s models/en_US-lessac-medium.onnx
          test -s models/en_US-lessac-medium.onnx.json

          echo "Piper voice downloaded successfully."


      # ============================================================
      # 5. INSTALL OLLAMA
      # ============================================================

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          echo "Ollama installed."


      # ============================================================
      # 6. START OLLAMA
      # ============================================================

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          for i in {1..30}; do

            if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              exit 0
            fi

            sleep 2

          done

          echo "Ollama failed to start."
          cat ollama.log
          exit 1


      # ============================================================
      # 7. DOWNLOAD AI MODEL
      # ============================================================

      - name: Download AI model
        run: |
          ollama pull tinyllama

          echo "AI model downloaded."


      # ============================================================
      # 8. GET LATEST AI NEWS
      # ============================================================

      - name: Get latest AI news
        run: |

          curl \
            --retry 3 \
            --retry-delay 5 \
            -L \
            "https://news.google.com/rss/search?q=artificial%20intelligence%20AI%20robots%20technology&hl=en-US&gl=US&ceid=US:en" \
            -o news.xml

          test -s news.xml

          echo "News downloaded."

          head -40 news.xml


      # ============================================================
      # 9. EXTRACT NEWS ARTICLES
      # ============================================================

      - name: Extract news articles
        run: |

          python3 <<'PY'

          import feedparser

          feed = feedparser.parse("news.xml")

          if not feed.entries:
              raise RuntimeError("No news articles found.")

          with open("articles.txt", "w", encoding="utf-8") as f:

              for i, entry in enumerate(feed.entries[:10], 1):

                  title = entry.get("title", "")
                  summary = entry.get("summary", "")
                  link = entry.get("link", "")

                  f.write(
                      f"ARTICLE {i}\n"
                      f"TITLE: {title}\n"
                      f"SUMMARY: {summary}\n"
                      f"URL: {link}\n\n"
                  )

          print("Articles extracted.")

          PY

          echo "=============================="
          echo "NEWS ARTICLES"
          echo "=============================="

          cat articles.txt


      # ============================================================
      # 10. CREATE AI PROMPT
      # ============================================================

      - name: Create AI prompt
        run: |

          cat > prompt.txt <<'PROMPT'

          You are an expert YouTube Shorts producer.

          Your job is to create ONE original YouTube Shorts story
          about a recent AI or technology news event.

          IMPORTANT:

          Use ONLY information contained in the NEWS ARTICLES.

          Do not invent facts.

          Do not invent statistics.

          Do not invent quotes.

          Do not invent people.

          Do not invent events.

          The final narration must be between approximately
          30 and 60 seconds.

          Use simple natural English.

          Start with a strong hook.

          Keep the viewer curious.

          The narration must be original storytelling.

          Do not use emojis.

          Do not use bullet points in the narration.

          Do not put headings inside the narration.

          Create exactly FIVE visual scenes.

          All five scenes must describe the SAME story.

          Each scene must be visually different.

          Visual prompts must describe realistic cinematic
          technology journalism.

          Visual prompts must contain:

          No text.
          No watermark.
          No logo.

          RETURN EXACTLY THIS FORMAT:

          TITLE:
          [short title]

          DESCRIPTION:
          [short YouTube description]

          SCRIPT:
          [30-60 second narration]

          SCENE1:
          [visual prompt]

          SCENE2:
          [visual prompt]

          SCENE3:
          [visual prompt]

          SCENE4:
          [visual prompt]

          SCENE5:
          [visual prompt]

          TAGS:
          [comma separated tags]

          NEWS ARTICLES:

          PROMPT

          cat articles.txt >> prompt.txt

          echo "AI prompt created."


      # ============================================================
      # 11. GENERATE STORY
      # ============================================================

      - name: Generate AI story
        run: |

          ollama run tinyllama "$(cat prompt.txt)" > story.txt

          test -s story.txt

          echo "=============================="
          echo "GENERATED AI STORY"
          echo "=============================="

          cat story.txt


      # ============================================================
      # 12. PARSE AI OUTPUT
      # ============================================================

      - name: Parse AI output
        run: |

          python3 <<'PY'

          import re
          import sys

          text = open(
              "story.txt",
              encoding="utf-8"
          ).read()

          def extract(start, end):

              pattern = (
                  rf"^\s*{start}\s*:\s*(.*?)"
                  rf"(?=^\s*{end}\s*:)"
              )

              match = re.search(
                  pattern,
                  text,
                  re.IGNORECASE |
                  re.MULTILINE |
                  re.DOTALL
              )

              if not match:
                  return ""

              return match.group(1).strip()


          title = extract(
              "TITLE",
              "DESCRIPTION"
          )

          description = extract(
              "DESCRIPTION",
              "SCRIPT"
          )

          script = extract(
              "SCRIPT",
              "SCENE1"
          )

          scene1 = extract(
              "SCENE1",
              "SCENE2"
          )

          scene2 = extract(
              "SCENE2",
              "SCENE3"
          )

          scene3 = extract(
              "SCENE3",
              "SCENE4"
          )

          scene4 = extract(
              "SCENE4",
              "SCENE5"
          )

          scene5 = extract(
              "SCENE5",
              "TAGS"
          )

          tags = re.search(
              r"^\s*TAGS\s*:\s*(.*)$",
              text,
              re.IGNORECASE |
              re.MULTILINE |
              re.DOTALL
          )

          tags_text = ""

          if tags:
              tags_text = tags.group(1).strip()


          # --------------------------------------------------------
          # VALIDATION
          # --------------------------------------------------------

          if not title:
              print("ERROR: Title was not generated.")
              sys.exit(1)

          if not script:
              print("ERROR: Script was not generated.")
              sys.exit(1)

          if len(script.split()) < 50:
              print("ERROR: Script is too short.")
              print(script)
              sys.exit(1)

          scenes = [
              scene1,
              scene2,
              scene3,
              scene4,
              scene5
          ]

          for i, scene in enumerate(scenes, 1):

              if not scene:
                  print(
                      f"ERROR: Scene {i} was not generated."
                  )

                  sys.exit(1)


          # --------------------------------------------------------
          # SAVE FILES
          # --------------------------------------------------------

          open(
              "title.txt",
              "w",
              encoding="utf-8"
          ).write(title)

          open(
              "description.txt",
              "w",
              encoding="utf-8"
          ).write(description)

          open(
              "script.txt",
              "w",
              encoding="utf-8"
          ).write(script)

          open(
              "tags.txt",
              "w",
              encoding="utf-8"
          ).write(tags_text)


          for i, scene in enumerate(scenes, 1):

              open(
                  f"scene{i}.txt",
                  "w",
                  encoding="utf-8"
              ).write(scene)


          print("==============================")
          print("TITLE")
          print("==============================")

          print(title)

          print()
          print("==============================")
          print("SCRIPT")
          print("==============================")

          print(script)

          print()
          print("==============================")
          print("SCENES")
          print("==============================")

          for i, scene in enumerate(scenes, 1):

              print(f"\nSCENE {i}")
              print(scene)

          PY


      # ============================================================
      # 13. GENERATE FIVE AI IMAGES
      # ============================================================

      - name: Generate AI images
        run: |

          python3 <<'PY'

          import requests
          import urllib.parse
          import time
          import os

          for i in range(1, 6):

              scene_file = f"scene{i}.txt"

              if not os.path.exists(scene_file):
                  raise RuntimeError(
                      f"{scene_file} does not exist."
                  )

              prompt = open(
                  scene_file,
                  encoding="utf-8"
              ).read().strip()

              if not prompt:
                  raise RuntimeError(
                      f"Scene {i} is empty."
                  )

              full_prompt = (
                  "Vertical 9:16 cinematic realistic "
                  "technology news visual. "
                  "Professional photography. "
                  "High detail. "
                  "Dramatic lighting. "
                  "Realistic environment. "
                  "No text. "
                  "No watermark. "
                  "No logo. "
                  + prompt
              )

              encoded = urllib.parse.quote(
                  full_prompt
              )

              url = (
                  "https://image.pollinations.ai/prompt/"
                  + encoded
                  + "?width=1080"
                  + "&height=1920"
                  + "&nologo=true"
              )

              output_file = f"image{i}.jpg"

              print()
              print(
                  f"Generating image {i}/5..."
              )

              success = False

              for attempt in range(1, 4):

                  try:

                      response = requests.get(
                          url,
                          timeout=180
                      )

                      print(
                          "HTTP:",
                          response.status_code,
                          "SIZE:",
                          len(response.content)
                      )

                      content_type = response.headers.get(
                          "content-type",
                          ""
                      )

                      if (
                          response.status_code == 200
                          and len(response.content) > 10000
                          and "image" in content_type.lower()
                      ):

                          with open(
                              output_file,
                              "wb"
                          ) as f:

                              f.write(
                                  response.content
                              )

                          print(
                              f"{output_file} created."
                          )

                          success = True

                          break

                      print(
                          f"Attempt {attempt} failed."
                      )

                  except Exception as e:

                      print(
                          f"Attempt {attempt} error:"
                      )

                      print(e)

                  time.sleep(5)


              if not success:

                  raise RuntimeError(
                      f"Could not generate image {i}."
                  )


          print()
          print(
              "ALL FIVE IMAGES CREATED SUCCESSFULLY."
          )

          PY


      # ============================================================
      # 14. GENERATE VOICEOVER
      # ============================================================

      - name: Generate voiceover
        run: |

          python3 -m piper \
            -m models/en_US-lessac-medium.onnx \
            -i script.txt \
            -f voiceover.wav

          test -s voiceover.wav

          echo "Voiceover generated."


      # ============================================================
      # 15. CREATE CAPTIONS
      # ============================================================

      - name: Create captions
        run: |

          python3 <<'PY'

          import wave

          script = open(
              "script.txt",
              encoding="utf-8"
          ).read().strip()

          words = script.split()

          if not words:
              raise RuntimeError(
                  "Script is empty."
              )

          with wave.open(
              "voiceover.wav",
              "rb"
          ) as audio:

              duration = (
                  audio.getnframes()
                  /
                  audio.getframerate()
              )


          time_per_word = (
              duration / len(words)
          )


          def timestamp(seconds):

              h = int(seconds // 3600)

              m = int(
                  (seconds % 3600) // 60
              )

              s = int(seconds % 60)

              ms = int(
                  (seconds - int(seconds))
                  * 1000
              )

              return (
                  f"{h:02}:{m:02}:"
                  f"{s:02},{ms:03}"
              )


          with open(
              "captions.srt",
              "w",
              encoding="utf-8"
          ) as f:

              chunk_size = 5

              number = 1

              for i in range(
                  0,
                  len(words),
                  chunk_size
              ):

                  chunk = words[
                      i:i + chunk_size
                  ]

                  start = (
                      i * time_per_word
                  )

                  end = min(
                      (
                          i + len(chunk)
                      ) * time_per_word,
                      duration
                  )

                  f.write(
                      f"{number}\n"
                  )

                  f.write(
                      f"{timestamp(start)} --> "
                      f"{timestamp(end)}\n"
                  )

                  f.write(
                      " ".join(chunk)
                  )

                  f.write(
                      "\n\n"
                  )

                  number += 1


          print("Captions created.")

          PY


      # ============================================================
      # 16. CREATE BACKGROUND MUSIC
      # ============================================================

      - name: Create background music
        run: |

          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=110:sample_rate=44100" \
            -f lavfi \
            -i "sine=frequency=165:sample_rate=44100" \
            -filter_complex \
            "[0:a]volume=0.02[a0];[1:a]volume=0.012[a1];[a0][a1]amix=inputs=2:duration=longest" \
            -t 120 \
            music.wav

          test -s music.wav

          echo "Background audio created."


      # ============================================================
      # 17. GET VOICEOVER DURATION
      # ============================================================

      - name: Get duration
        run: |

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voiceover.wav \
            > duration.txt

          echo "Voiceover duration:"

          cat duration.txt


      # ============================================================
      # 18. CREATE FIVE VISUAL CLIPS
      # ============================================================

      - name: Create visual clips
        run: |

          DURATION=$(cat duration.txt)

          CLIP_DURATION=$(python3 -c "
          d=float('$DURATION')
          print(max(d/5,1))
          ")

          echo "Each clip duration:"
          echo "$CLIP_DURATION"


          for i in 1 2 3 4 5
          do

            echo "Creating clip $i..."

            ffmpeg -y \
              -loop 1 \
              -i "image${i}.jpg" \
              -t "$CLIP_DURATION" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0007,1.08)':d=1:s=1080x1920:fps=30" \
              -r 30 \
              -pix_fmt yuv420p \
              -an \
              "clip${i}.mp4"

          done

          echo "All clips created."


      # ============================================================
      # 19. JOIN CLIPS
      # ============================================================

      - name: Join visual clips
        run: |

          rm -f concat.txt

          for i in 1 2 3 4 5
          do
            echo "file 'clip${i}.mp4'" >> concat.txt
          done

          cat concat.txt

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            visuals.mp4

          test -s visuals.mp4

          echo "Visual video created."


      # ============================================================
      # 20. CREATE FINAL SHORT
      # ============================================================

      - name: Create final Short
        run: |

          ffmpeg -y \
            -i visuals.mp4 \
            -i voiceover.wav \
            -i music.wav \
            -filter_complex \
            "[2:a]volume=0.08[music];[1:a]volume=1.0[voice];[voice][music]amix=inputs=2:duration=first[audio]" \
            -map 0:v \
            -map "[audio]" \
            -vf "subtitles=captions.srt:force_style='FontName=DejaVu Sans,FontSize=18,Bold=1,Alignment=2,MarginV=180'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -pix_fmt yuv420p \
            -movflags +faststart \
            short.mp4

          test -s short.mp4

          echo "FINAL SHORT CREATED."


      # ============================================================
      # 21. VALIDATE FINAL VIDEO
      # ============================================================

      - name: Validate final video
        run: |

          echo "Checking final video..."

          ffprobe \
            -v error \
            short.mp4

          DIMENSIONS=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of csv=s=x:p=0 \
            short.mp4)

          echo "Dimensions: $DIMENSIONS"

          if [ "$DIMENSIONS" != "1080x1920" ]; then

            echo "ERROR: Wrong video dimensions."

            exit 1

          fi


          AUDIO=$(ffprobe \
            -v error \
            -select_streams a \
            -show_entries stream=index \
            -of csv=p=0 \
            short.mp4)

          if [ -z "$AUDIO" ]; then

            echo "ERROR: No audio found."

            exit 1

          fi


          DURATION=$(ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            short.mp4)

          echo "Final video duration:"
          echo "$DURATION"

          echo "VIDEO VALIDATION PASSED."


      # ============================================================
      # 22. UPLOAD RESULT AS GITHUB ARTIFACT
      # ============================================================

      - name: Upload generated files
        uses: actions/upload-artifact@v4

        with:

          name: youtube-short

          path: |
            short.mp4
            title.txt
            description.txt
            tags.txt
            script.txt
            story.txt
            captions.srt
            voiceover.wav
            image1.jpg
            image2.jpg
            image3.jpg
            image4.jpg
            image5.jpg


      # ============================================================
      # 23. SHOW RESULT
      # ============================================================

      - name: Show result
        run: |

          echo ""
          echo "=========================================="
          echo "       YOUTUBE SHORT CREATED"
          echo "=========================================="

          echo ""

          echo "TITLE:"
          cat title.txt

          echo ""

          echo "DESCRIPTION:"
          cat description.txt

          echo ""

          echo "TAGS:"
          cat tags.txt

          echo ""

          echo "FILES:"

          ls -lh \
            short.mp4 \
            voiceover.wav \
            captions.srt \
            image*.jpg

          echo ""
          echo "=========================================="
          echo "              SUCCESS"
          echo "=========================================="
