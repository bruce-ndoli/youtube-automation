name: YouTube Automation

on:
  workflow_dispatch:

jobs:
  create-script:
    runs-on: ubuntu-latest

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          sleep 5

      - name: Download AI model
        run: |
          ollama pull tinyllama

      - name: Get latest news
        run: |
          curl -L "https://news.google.com/rss/search?q=AI%20robots%20in%20factories&hl=en-US&gl=US&ceid=US:en" -o news.xml

      - name: Generate script
        run: |
          NEWS=$(cat news.xml)

          PROMPT="You are a YouTube Shorts scriptwriter.

          Write an engaging 30 to 60 second narration based ONLY on the news below.

          Rules:
          - Start with a strong hook.
          - Use simple English.
          - Do not invent facts.
          - Do not use headings.
          - Do not use bullet points.
          - Do not use emojis.
          - Write ONLY the narration.

          NEWS:
          $NEWS"

          ollama run tinyllama "$PROMPT" > script.txt

      - name: Show generated script
        run: |
          echo "===== GENERATED SCRIPT ====="
          cat script.txt
