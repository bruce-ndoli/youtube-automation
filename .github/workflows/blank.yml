name: YouTube Automation

on:
  workflow_dispatch:

jobs:
  create-voice:
    runs-on: ubuntu-latest

    steps:
      - name: Install Piper
        run: |
          python3 -m pip install piper-tts

      - name: Download Piper voice
        run: |
          mkdir -p models
          curl -L "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx?download=true" -o models/en_US-lessac-medium.onnx
          curl -L "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json?download=true" -o models/en_US-lessac-medium.onnx.json

      - name: Create test script
        run: |
          echo "This is a test of our YouTube automation system. The entire process is running in the cloud without your computer." > script.txt

      - name: Generate voice
        run: |
          python3 -m piper \
            -m models/en_US-lessac-medium.onnx \
            -i script.txt \
            -f voiceover.wav

      - name: Upload voice file
        uses: actions/upload-artifact@v7
        with:
          name: voiceover
          path: voiceover.wav
