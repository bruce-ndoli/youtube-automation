name: YouTube Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest AI news
        run: |
          curl -L "https://news.google.com/rss/search?q=AI%20robots%20in%20factories&hl=en-US&gl=US&ceid=US:en" -o news.xml

      - name: Show news
        run: |
          echo "===== LATEST NEWS ====="
          head -100 news.xml
