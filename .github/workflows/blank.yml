      - name: Generate script with AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'EOF'
          import urllib.request
          import urllib.error
          import json
          import os
          import sys

          headline = open("headline.txt").read().strip()
          api_key = os.environ.get("GROQ_API_KEY")

          if not api_key:
              print("ERROR: GROQ_API_KEY secret is missing.")
              sys.exit(1)

          prompt = (
              "You are writing a YouTube Shorts voiceover script for a tech/AI "
              "news channel. Rules:\n"
              "- Start with a strong hook in the first sentence (a surprising "
              "fact, a question, or 'Here's what just happened...').\n"
              "- Explain the news in simple, punchy, spoken language (not "
              "written/formal).\n"
              "- End with a short line encouraging the viewer to follow/"
              "subscribe for more AI news, worked naturally into the ending "
              "(not a hard sales pitch).\n"
              "- Plain narration only: no hashtags, no emojis, no headers, no "
              "stage directions, no asterisks.\n"
              "- Length: strictly between 90 and 140 words total. Do not "
              "exceed 140 words.\n\n"
              "News:\n" + headline
          )

          url = "https://api.groq.com/openai/v1/chat/completions"
          body = json.dumps({
              "model": "llama-3.3-70b-versatile",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.8,
              "max_tokens": 300
          }).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"ERROR: Groq API returned {e.code}: {e.read().decode('utf-8')}")
              sys.exit(1)
          except Exception as e:
              print(f"ERROR: Groq request failed: {e}")
              sys.exit(1)

          try:
              script = result["choices"][0]["message"]["content"].strip()
          except (KeyError, IndexError):
              print(f"ERROR: Unexpected Groq response: {json.dumps(result)}")
              sys.exit(1)

          script = script.replace("*", "").replace("#", "")

          words = script.split()
          if len(words) > 140:
              script = " ".join(words[:140])
          elif len(words) < 40:
              print(f"ERROR: Script too short ({len(words)} words) — likely a bad response.")
              sys.exit(1)

          with open("script.txt", "w") as f:
              f.write(script)

          print(f"Script generated: {len(script.split())} words")
          EOF
